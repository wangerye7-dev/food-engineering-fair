<main><section class="page-title"><div class="container"><div class="inner"><div class="breadcrumb"><a href="index.html">首页</a> / 校企合作需求登记</div><h1 style="font-size:38px">校企合作需求登记</h1><p class="muted">面向食品及农产品加工企业，对接学生实习就业、企业导师、员工培训、课程共建、真实案例和联合项目。</p></div></div></section>
<section class="section"><div class="container form-shell"><form id="coopForm">
<div class="form-card"><h2 style="font-size:24px">企业与联系人</h2><div class="grid grid-2"><div class="field"><label class="label">企业名称<span class="required">*</span></label><input name="company" required maxlength="80"></div><div class="field"><label class="label">联系人<span class="required">*</span></label><input name="contact" required maxlength="30"></div><div class="field"><label class="label">职务</label><input name="position" maxlength="40"></div><div class="field"><label class="label">电话或微信<span class="required">*</span></label><input name="phone" required maxlength="40"></div></div></div>
<div class="form-card"><h2 style="font-size:24px">合作方向</h2><div class="option-grid" data-required-group="types"><label class="option"><input type="checkbox" name="types" value="学生岗位实习">学生岗位实习</label><label class="option"><input type="checkbox" name="types" value="毕业生招聘">毕业生招聘</label><label class="option"><input type="checkbox" name="types" value="企业导师与兼职教师">企业导师与兼职教师</label><label class="option"><input type="checkbox" name="types" value="员工技能培训">员工技能培训</label><label class="option"><input type="checkbox" name="types" value="课程与实训项目共建">课程与实训项目共建</label><label class="option"><input type="checkbox" name="types" value="真实生产案例开发">真实生产案例开发</label><label class="option"><input type="checkbox" name="types" value="学生技能评价">学生技能评价</label><label class="option"><input type="checkbox" name="types" value="联合技术服务或工艺改进">联合技术服务或工艺改进</label></div><div class="field"><label class="label">合作需求说明<span class="required">*</span></label><textarea name="detail" required placeholder="请简要说明岗位、人数、培训主题、项目方向或拟合作时间等信息"></textarea></div><div class="field"><label class="option"><input type="checkbox" name="consent" required>同意学院根据本次登记内容进行校企合作联系。<span class="required">*</span></label></div></div>
<div class="form-card"><button class="btn btn-primary" type="submit">提交合作需求</button><p class="help">提交后将生成登记编号，便于现场交流和后续对接。</p></div></form>
<aside class="sticky-card"><h3>可对接事项</h3><p class="muted">实习岗位、招聘需求、订单培养、企业导师、课程共建、员工培训、案例开发、校外基地和联合项目。</p><a class="btn btn-secondary" href="survey.html" style="width:100%">先填写人才需求调研</a></aside></div></section></main>
